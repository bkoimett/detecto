services:
  - type: web
    name: detecto-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PATH
        value: backend/yolov8n.pt
      - key: CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: DB_PATH
        value: /var/data/detections.db
      # Update FRONTEND_ORIGINS to the real Vercel domain after first deploy.
      # Comma-separated list allowed (e.g. localhost + prod): http://localhost:5173,https://detecto.vercel.app
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,https://detecto.vercel.app
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1